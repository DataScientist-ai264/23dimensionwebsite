<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2+3Dimension – A Kantian Advisory House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              background: "var(--bg-primary)",
              foreground: "var(--bg-secondary)",
              surface: "var(--surface)",
              border: "var(--border)",
              "border-strong": "var(--border-strong)",

              text: {
                DEFAULT: "var(--text-primary)",
                secondary: "var(--text-secondary)",
              },

              accent: {
                gold: "var(--accent-gold)",
                cyan: "var(--accent-cyan)",
              },
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-out forwards",
              "fade-in-up": "fadeInUp 0.5s ease-out forwards",
              "particle-drift": "drift 60s infinite linear",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: 0 },
                "100%": { opacity: 1 },
              },
              fadeInUp: {
                "0%": { opacity: 0, transform: "translateY(10px)" },
                "100%": { opacity: 1, transform: "translateY(0)" },
              },
              drift: {
                "0%": { transform: "translate(0, 0)" },
                "100%": { transform: "translate(100px, -100px)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #f1f5f9;
        --text-primary: #0b1020;
        --text-secondary: #334155;
        --accent-gold: #b8860b;
        --accent-cyan: #1fb6ff;
        --surface: #ffffff;
        --border: #e2e8f0;
        --border-strong: #d1d5db;
      }
      html.dark {
        --bg-primary: #0b0f14;
        --bg-secondary: #0f141b;
        --text-primary: #f5f7fa;
        --text-secondary: #b7c0cc;
        --accent-gold: #d2a85a;
        --accent-cyan: #2cd3e1;
        --surface: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.3);
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.6;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      
      h1 {
        letter-spacing: -0.03em;
        font-weight: 700;
      }
      
      p, body, .text-base {
        line-height: 1.7;
        letter-spacing: 0.01em;
      }
      
      .font-serif {
        letter-spacing: -0.01em;
      }
      
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      .underline-grow {
        position: relative;
      }
      .underline-grow::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 50%;
        width: 0;
        height: 2px;
        background-color: var(--accent-cyan);
        transition: all 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
        transform: translateX(-50%);
      }
      .group:hover .underline-grow::after,
      .underline-grow:hover::after,
      .active-link.underline-grow::after {
        width: 100%;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.3"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
